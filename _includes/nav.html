<header class="site-nav">
  <div class="wrap">
    <a class="brand" href="{{ '/' | relative_url }}">{{ site.author }}<span class="brand-sub">{{ site.tagline }}</span></a>
    <nav aria-label="Primary">
      <ul>
        {%- assign cur = page.url -%}
        {%- for item in site.nav -%}
          {%- assign item_url = item.url | relative_url -%}
          <li>
            <a href="{{ item_url }}"
               {% if page.url == item.url %}aria-current="page"{% endif %}>{{ item.title }}</a>
          </li>
        {%- endfor -%}
      </ul>
    </nav>
  </div>
</header>
