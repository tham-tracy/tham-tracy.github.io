title: "Tracy Le · Fintech Product Manager"
tagline: "Fintech product manager"
description: >-
  Tracy Le, product manager for wealth, investment and digital-asset
  products. Case studies, research method and domain notes.
author: "Tracy Le"
url: "https://tham-tracy.github.io"
baseurl: ""
lang: en

# --- Build settings ---
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
permalink: pretty
sass:
  style: compressed

# --- Contact / links surfaced in the footer and summary page ---
links:
  email: "thamle54.ftu@gmail.com"
  github: "https://github.com/tham-tracy"
  linkedin: "https://www.linkedin.com/in/tracyleth/"

# --- Top navigation (rendered by _includes/nav.html) ---
nav:
  - title: "Home"
    url: "/"
  - title: "About"
    url: "/about/"
  - title: "Aura"
    url: "/work/aura/"
  - title: "TCBS"
    url: "/work/tcbs-loan-management/"
  - title: "How I research"
    url: "/research/"
  - title: "Domain notes"
    url: "/notes/"

# --- Domain notes (one Markdown file per note in _notes/) ---
collections:
  notes:
    output: true
    permalink: /notes/:name/

defaults:
  - scope:
      type: notes
    values:
      layout: note

# --- Exclude from the built site ---
exclude:
  - README.md
  - CLAUDE.md
  - claude.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .claude
  - scratchpad
  - docs
