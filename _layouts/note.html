---
layout: default
---
<article class="note wrap">
  <header class="note-header">
    <p class="cs-kicker">Domain note · {{ page.tag }} · {{ page.read_time }} read</p>
    <h1>{{ page.title }}</h1>
    {%- if page.summary %}<p class="cs-standfirst">{{ page.summary }}</p>{% endif -%}
  </header>
  <div class="note-body">
    {{ content }}
  </div>
  <p class="note-back"><a class="text-link" href="{{ '/notes/' | relative_url }}"><span aria-hidden="true">←</span> All notes</a></p>
</article>
